[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "throng-wasm"
version = "0.0.1"
authors = [
  { name="Evgeniy Blinov", email="zheni-b@yandex.ru" },
]
description = 'Run CPython WASI commands in Wasmtime sandboxes through throng'
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    'throng>=0.0.4',
    'dirstree>=0.0.12',
    'pathspec>=0.12.0',
    'cantok>=0.0.42',
    'wasmtime>=25.0.0,<39',
    'packaging>=24.2',
    'resolvelib>=1.1,<1.2',
    'microbenchmark>=0.0.3',
]
classifiers = [
    "Operating System :: OS Independent",
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries',
    'Typing :: Typed',
]
keywords = [
    'WASM',
    'execute commands',
    'isolated environments',
    'sandboxes',
]

[tool.setuptools.package-data]
"throng_wasm" = ["py.typed", "data/python-3.13.11-wasi_sdk-24.zip", "data/RUNTIME_LICENSES.txt"]

[tool.setuptools.packages.find]
include = ["throng_wasm*"]

[tool.mutmut]
paths_to_mutate=["throng_wasm"]

[tool.coverage.run]
branch = "${THRONG_COVERAGE_BRANCH-false}"
omit = ["*tests*"]
parallel = true
plugins = ["coverage_pyver_pragma"]
source = ["throng_wasm"]

[tool.pytest.ini_options]
norecursedirs = ["build", "mutants"]

[tool.ruff]
lint.ignore = ['E501', 'E712', 'PTH123', 'PTH118', 'PLR2004', 'PTH107', 'SIM105', 'SIM102', 'RET503', 'PLR0912', 'C901', 'E731', 'F821']
lint.select = ["ERA001", "YTT", "ASYNC", "BLE", "B", "A", "COM", "INP", "PIE", "T20", "PT", "RSE", "RET", "SIM", "SLOT", "TID252", "ARG", "PTH", "I", "C90", "N", "E", "W", "D201", "D202", "D419", "F", "PL", "PLE", "PLR", "PLW", "RUF", "TRY201", "TRY400", "TRY401"]
lint.isort.combine-as-imports = true
format.quote-style = "single"

[project.entry-points.throng]
wasm = "throng_wasm.plugin:wasm"

[project.urls]
'Source' = 'https://github.com/mutating/throng_local_wasm'
'Tracker' = 'https://github.com/mutating/throng_local_wasm/issues'
